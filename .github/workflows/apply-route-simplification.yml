name: Apply route simplification

on:
  push:
    branches: [agent/route-visual-audit]
    paths:
      - .github/route-simplification-apply-request

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
      - name: Preserve baseline route data
        run: |
          mkdir -p /tmp/route-baseline
          cp miniprogram/data/sameFloorPaths.js /tmp/route-baseline/sameFloorPaths.js
          cp miniprogram/data/floorNavPaths.js /tmp/route-baseline/floorNavPaths.js
      - name: Apply deterministic segment-count tie breaker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          solver_path = Path('scripts/safe_path_solver.py')
          text = solver_path.read_text(encoding='utf-8')
          old_label = '''def _label_is_better(candidate: TurnLabel, existing: TurnLabel) -> bool:\n    if candidate.distance != existing.distance:\n        return candidate.distance < existing.distance\n    if candidate.min_clearance_px != existing.min_clearance_px:\n        return candidate.min_clearance_px > existing.min_clearance_px\n    return candidate.path < existing.path\n'''
          new_label = '''def _label_is_better(candidate: TurnLabel, existing: TurnLabel) -> bool:\n    if candidate.distance != existing.distance:\n        return candidate.distance < existing.distance\n    if candidate.min_clearance_px != existing.min_clearance_px:\n        return candidate.min_clearance_px > existing.min_clearance_px\n    if len(candidate.path) != len(existing.path):\n        return len(candidate.path) < len(existing.path)\n    return candidate.path < existing.path\n'''
          old_goal = '''def _goal_label_is_better(\n    candidate_key: tuple[int, int, int],\n    candidate: TurnLabel,\n    existing_key: tuple[int, int, int],\n    existing: TurnLabel,\n) -> bool:\n    if candidate_key[0] != existing_key[0]:\n        return candidate_key[0] < existing_key[0]\n    return _label_is_better(candidate, existing)\n'''
          new_goal = '''def _goal_label_is_better(\n    candidate_key: tuple[int, int, int],\n    candidate: TurnLabel,\n    existing_key: tuple[int, int, int],\n    existing: TurnLabel,\n) -> bool:\n    if candidate_key[0] != existing_key[0]:\n        return candidate_key[0] < existing_key[0]\n    if len(candidate.path) != len(existing.path):\n        return len(candidate.path) < len(existing.path)\n    return _label_is_better(candidate, existing)\n'''
          if text.count(old_label) != 1:
              raise SystemExit('expected exactly one _label_is_better block')
          if text.count(old_goal) != 1:
              raise SystemExit('expected exactly one _goal_label_is_better block')
          solver_path.write_text(
              text.replace(old_label, new_label).replace(old_goal, new_goal),
              encoding='utf-8',
              newline='\n',
          )

          policy_path = Path('config/routing-policy.json')
          policy = policy_path.read_text(encoding='utf-8')
          old_version = 'grid-a-star-visible-local-v1'
          new_version = 'grid-a-star-visible-local-v2'
          if policy.count(old_version) != 1:
              raise SystemExit('expected exactly one routing algorithm version')
          policy_path.write_text(
              policy.replace(old_version, new_version),
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Run focused regression suite
        shell: bash
        run: |
          mkdir -p reports/route-visual-review
          set -o pipefail
          python -m pytest \
            tests/python/test_safe_path_solver.py \
            tests/python/test_route_visual_simplification.py \
            -q 2>&1 | tee reports/route-visual-review/focused-tests.log
      - name: Regenerate canonical routes
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/generate-floor-nav-paths.py --floor-dir miniprogram/assets/floor-maps
            python scripts/generate-same-floor-paths.py --floor-dir miniprogram/assets/floor-maps
          } 2>&1 | tee reports/route-visual-review/generation.log
      - name: Summarize route changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          from pathlib import Path

          REPORT_DIR = Path('reports/route-visual-review')
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          def load_commonjs(path: Path) -> dict:
              text = path.read_text(encoding='utf-8-sig').strip()
              marker = 'module.exports ='
              if marker not in text:
                  raise ValueError(f'missing CommonJS export: {path}')
              body = text.split(marker, 1)[1].strip()
              if body.endswith(';'):
                  body = body[:-1].rstrip()
              value = json.loads(body)
              if not isinstance(value, dict):
                  raise TypeError(f'route export is not an object: {path}')
              return value

          sources = (
              ('sameFloor', Path('/tmp/route-baseline/sameFloorPaths.js'), Path('miniprogram/data/sameFloorPaths.js')),
              ('floorNav', Path('/tmp/route-baseline/floorNavPaths.js'), Path('miniprogram/data/floorNavPaths.js')),
          )
          rows = []
          totals = {
              'routeCount': 0,
              'changedRouteCount': 0,
              'reducedPointRouteCount': 0,
              'pointIncreaseRouteCount': 0,
              'turnReductionRouteCount': 0,
              'turnIncreaseRouteCount': 0,
              'totalPointsBefore': 0,
              'totalPointsAfter': 0,
              'totalTurnsBefore': 0,
              'totalTurnsAfter': 0,
              'maxPointsBefore': 0,
              'maxPointsAfter': 0,
              'maxTurnsBefore': 0,
              'maxTurnsAfter': 0,
          }
          for kind, before_path, after_path in sources:
              before = load_commonjs(before_path)
              after = load_commonjs(after_path)
              if set(before) != set(after):
                  missing = sorted(set(before) - set(after))
                  extra = sorted(set(after) - set(before))
                  raise SystemExit(f'{kind} key drift: missing={missing} extra={extra}')
              for key in sorted(before):
                  left = before[key]
                  right = after[key]
                  before_points = len(left.get('points') or [])
                  after_points = len(right.get('points') or [])
                  before_turns = int(left.get('effectiveTurnCount') or 0)
                  after_turns = int(right.get('effectiveTurnCount') or 0)
                  changed = left.get('points') != right.get('points')
                  totals['routeCount'] += 1
                  totals['changedRouteCount'] += int(changed)
                  totals['reducedPointRouteCount'] += int(after_points < before_points)
                  totals['pointIncreaseRouteCount'] += int(after_points > before_points)
                  totals['turnReductionRouteCount'] += int(after_turns < before_turns)
                  totals['turnIncreaseRouteCount'] += int(after_turns > before_turns)
                  totals['totalPointsBefore'] += before_points
                  totals['totalPointsAfter'] += after_points
                  totals['totalTurnsBefore'] += before_turns
                  totals['totalTurnsAfter'] += after_turns
                  totals['maxPointsBefore'] = max(totals['maxPointsBefore'], before_points)
                  totals['maxPointsAfter'] = max(totals['maxPointsAfter'], after_points)
                  totals['maxTurnsBefore'] = max(totals['maxTurnsBefore'], before_turns)
                  totals['maxTurnsAfter'] = max(totals['maxTurnsAfter'], after_turns)
                  if changed:
                      rows.append(
                          {
                              'kind': kind,
                              'key': key,
                              'floor': right.get('floor', ''),
                              'pointsBefore': before_points,
                              'pointsAfter': after_points,
                              'pointsRemoved': before_points - after_points,
                              'turnsBefore': before_turns,
                              'turnsAfter': after_turns,
                              'routeLengthBefore': left.get('routeLength', ''),
                              'routeLengthAfter': right.get('routeLength', ''),
                              'clearanceBefore': left.get('minClearancePx', ''),
                              'clearanceAfter': right.get('minClearancePx', ''),
                              'geometryBefore': left.get('geometrySha256', ''),
                              'geometryAfter': right.get('geometrySha256', ''),
                          }
                      )
          if totals['pointIncreaseRouteCount']:
              raise SystemExit(f"unexpected point increases: {totals['pointIncreaseRouteCount']}")
          if totals['turnIncreaseRouteCount']:
              raise SystemExit(f"unexpected turn increases: {totals['turnIncreaseRouteCount']}")
          totals['pointsRemoved'] = totals['totalPointsBefore'] - totals['totalPointsAfter']
          totals['turnsRemoved'] = totals['totalTurnsBefore'] - totals['totalTurnsAfter']
          totals['pointReductionPercent'] = round(
              totals['pointsRemoved'] / totals['totalPointsBefore'] * 100,
              3,
          ) if totals['totalPointsBefore'] else 0
          rows.sort(
              key=lambda row: (
                  -int(row['pointsRemoved']),
                  -int(row['turnsBefore']) + int(row['turnsAfter']),
                  str(row['floor']),
                  str(row['key']),
              )
          )
          (REPORT_DIR / 'generation-summary.json').write_text(
              json.dumps(
                  {
                      'schemaVersion': 1,
                      **totals,
                      'topChanges': rows[:100],
                  },
                  ensure_ascii=False,
                  indent=2,
                  allow_nan=False,
              ) + '\n',
              encoding='utf-8',
          )
          fieldnames = list(rows[0]) if rows else [
              'kind', 'key', 'floor', 'pointsBefore', 'pointsAfter',
              'pointsRemoved', 'turnsBefore', 'turnsAfter',
              'routeLengthBefore', 'routeLengthAfter',
              'clearanceBefore', 'clearanceAfter',
              'geometryBefore', 'geometryAfter',
          ]
          with (REPORT_DIR / 'route-changes.csv').open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          print(json.dumps(totals, ensure_ascii=False, indent=2))
          PY
      - name: Run candidate verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify:candidate 2>&1 | tee reports/route-visual-review/candidate-verification.log
      - name: Commit verified implementation and generated routes
        shell: bash
        run: |
          rm -f .github/route-simplification-apply-request
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/safe_path_solver.py \
            config/routing-policy.json \
            miniprogram/data/sameFloorPaths.js \
            miniprogram/data/floorNavPaths.js \
            miniprogram/data/elevatorShafts.js \
            reports/route-visual-review \
            .github/route-simplification-apply-request
          git commit -m 'Prefer simpler route geometry on equal-turn paths'
          git push origin HEAD:agent/route-visual-audit
