name: Render route visual audit

on:
  push:
    branches: [agent/route-visual-audit]
    paths:
      - .github/route-visual-audit-request

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install renderer dependencies and CJK fonts
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Extract main-branch route baseline
        run: |
          mkdir -p /tmp/route-baseline
          git show origin/main:miniprogram/data/sameFloorPaths.js > /tmp/route-baseline/sameFloorPaths.js
          git show origin/main:miniprogram/data/floorNavPaths.js > /tmp/route-baseline/floorNavPaths.js
      - name: Render all-route overview and detailed comparisons
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import importlib.util
          import json
          import math
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          REPORT = ROOT / 'reports' / 'route-visual-review' / 'visual-audit'
          OVERVIEW_DIR = REPORT / 'overview-sheets'
          COMPARISON_DIR = REPORT / 'comparison-sheets'
          for directory in (OVERVIEW_DIR, COMPARISON_DIR):
              directory.mkdir(parents=True, exist_ok=True)
              for stale in directory.glob('*.jpg'):
                  stale.unlink()

          spec = importlib.util.spec_from_file_location(
              'route_turn_quality', ROOT / 'scripts' / 'check-route-turn-quality.py'
          )
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load route quality renderer')
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)

          regular = Path('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc')
          bold = Path('/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc')
          if not regular.is_file():
              raise SystemExit('Noto CJK font not found')
          checker._font = lambda size, bold=False: ImageFont.truetype(
              str((globals()['bold'] if bold and globals()['bold'].is_file() else regular)),
              size=size,
          )

          def load_commonjs(path: Path) -> dict:
              text = path.read_text(encoding='utf-8-sig').strip()
              body = text.split('module.exports =', 1)[1].strip()
              if body.endswith(';'):
                  body = body[:-1].rstrip()
              value = json.loads(body)
              if not isinstance(value, dict):
                  raise TypeError(f'route export must be an object: {path}')
              return value

          def row(kind: str, key: str, record: dict):
              points = record.get('points') or []
              image_size = record.get('imageSize') or [1, 1]
              metrics = checker.analyze_geometry(points, image_size)
              geometry = str(record.get('geometrySha256') or checker.geometry_sha256(points))
              return checker.RouteRow(kind, key, record, metrics, geometry, False, '')

          datasets = (
              (
                  'sameFloor',
                  load_commonjs(Path('/tmp/route-baseline/sameFloorPaths.js')),
                  load_commonjs(ROOT / 'miniprogram/data/sameFloorPaths.js'),
              ),
              (
                  'floorNav',
                  load_commonjs(Path('/tmp/route-baseline/floorNavPaths.js')),
                  load_commonjs(ROOT / 'miniprogram/data/floorNavPaths.js'),
              ),
          )

          map_dir = ROOT / 'miniprogram/assets/floor-maps'
          map_cache: dict[Path, Image.Image] = {}

          def base_map(record: dict) -> Image.Image:
              path = checker._floor_map_path(map_dir, record)
              if path not in map_cache:
                  map_cache[path] = Image.open(path).convert('RGB')
              return map_cache[path]

          candidate_groups = {}
          comparison_groups = {}
          route_count = 0
          for kind, before, after in datasets:
              if set(before) != set(after):
                  raise SystemExit(f'{kind}: baseline/candidate route keys differ')
              for key in sorted(after):
                  route_count += 1
                  current = after[key]
                  points = current.get('points') or []
                  if len(points) < 2:
                      continue
                  context = (
                      kind,
                      str(current.get('floor') or ''),
                      str(current.get('image') or ''),
                      str(current.get('sourceFloorMapSha256') or ''),
                      str(current.get('geometrySha256') or checker.geometry_sha256(points)),
                  )
                  candidate_groups.setdefault(context, {'kind': kind, 'key': key, 'record': current, 'keys': []})['keys'].append(key)
                  previous = before[key]
                  if previous.get('points') == current.get('points'):
                      continue
                  compare_context = (
                      kind,
                      str(current.get('floor') or ''),
                      str(previous.get('geometrySha256') or checker.geometry_sha256(previous.get('points') or [])),
                      str(current.get('geometrySha256') or checker.geometry_sha256(points)),
                  )
                  group = comparison_groups.setdefault(
                      compare_context,
                      {
                          'kind': kind,
                          'key': key,
                          'before': previous,
                          'after': current,
                          'keys': [],
                      },
                  )
                  group['keys'].append(key)

          overview = []
          for group in candidate_groups.values():
              route_row = row(group['kind'], group['key'], group['record'])
              overview.append(
                  {
                      **group,
                      'row': route_row,
                      'pointCount': len(group['record'].get('points') or []),
                      'turns': route_row.metrics.spoken_turn_count,
                      'alternations': route_row.metrics.low_angle_alternations,
                  }
              )
          overview.sort(
              key=lambda item: (
                  -int(item['turns']),
                  -int(item['alternations']),
                  -int(item['pointCount']),
                  checker._floor_sort(item['record'].get('floor')),
                  str(item['kind']),
                  str(item['key']),
              )
          )

          overview_manifest = []
          card_width, card_height = 240, 233
          columns, rows_per_sheet = 10, 10
          sheet_capacity = columns * rows_per_sheet
          for page_start in range(0, len(overview), sheet_capacity):
              page = overview[page_start:page_start + sheet_capacity]
              sheet = Image.new('RGB', (columns * card_width, rows_per_sheet * card_height), (235, 239, 243))
              for offset, item in enumerate(page):
                  original = checker._route_card(base_map(item['record']), item['row'], sorted(item['keys']))
                  card = original.resize((card_width, card_height), Image.Resampling.LANCZOS)
                  x = (offset % columns) * card_width
                  y = (offset // columns) * card_height
                  sheet.paste(card, (x, y))
                  overview_manifest.append(
                      {
                          'index': page_start + offset + 1,
                          'sheet': page_start // sheet_capacity + 1,
                          'cell': offset + 1,
                          'kind': item['kind'],
                          'floor': item['record'].get('floor', ''),
                          'routeKeys': sorted(item['keys']),
                          'pointCount': item['pointCount'],
                          'effectiveTurns': item['turns'],
                          'lowAngleAlternations': item['alternations'],
                          'geometrySha256': item['row'].geometry_sha256,
                      }
                  )
              sheet.save(
                  OVERVIEW_DIR / f'overview-{page_start // sheet_capacity + 1:02d}.jpg',
                  quality=42,
                  optimize=True,
                  progressive=True,
              )

          comparisons = []
          for group in comparison_groups.values():
              before_row = row(group['kind'], group['key'], group['before'])
              after_row = row(group['kind'], group['key'], group['after'])
              before_points = len(group['before'].get('points') or [])
              after_points = len(group['after'].get('points') or [])
              comparisons.append(
                  {
                      **group,
                      'beforeRow': before_row,
                      'afterRow': after_row,
                      'pointsBefore': before_points,
                      'pointsAfter': after_points,
                      'pointsRemoved': before_points - after_points,
                      'turnsBefore': before_row.metrics.spoken_turn_count,
                      'turnsAfter': after_row.metrics.spoken_turn_count,
                  }
              )
          comparisons.sort(
              key=lambda item: (
                  -int(item['pointsRemoved']),
                  -(int(item['turnsBefore']) - int(item['turnsAfter'])),
                  -int(item['turnsBefore']),
                  checker._floor_sort(item['after'].get('floor')),
                  str(item['key']),
              )
          )

          detail_limit = min(24, len(comparisons))
          pair_width, pair_height = 1080, 540
          pairs_per_sheet = 4
          comparison_manifest = []
          for page_start in range(0, detail_limit, pairs_per_sheet):
              page = comparisons[page_start:page_start + pairs_per_sheet]
              sheet = Image.new('RGB', (pair_width * 2, pair_height * 2), (225, 230, 235))
              for offset, item in enumerate(page):
                  before_card = checker._route_card(
                      base_map(item['before']), item['beforeRow'], sorted(item['keys'])
                  )
                  after_card = checker._route_card(
                      base_map(item['after']), item['afterRow'], sorted(item['keys'])
                  )
                  pair = Image.new('RGB', (1460, 730), (245, 247, 249))
                  pair.paste(before_card, (5, 25))
                  pair.paste(after_card, (735, 25))
                  draw = ImageDraw.Draw(pair)
                  label_font = checker._font(22, bold=True)
                  draw.text((280, 0), 'BEFORE', fill=(170, 25, 30), font=label_font)
                  draw.text((1005, 0), 'AFTER', fill=(20, 115, 65), font=label_font)
                  pair = pair.resize((pair_width, pair_height), Image.Resampling.LANCZOS)
                  x = (offset % 2) * pair_width
                  y = (offset // 2) * pair_height
                  sheet.paste(pair, (x, y))
                  comparison_manifest.append(
                      {
                          'index': page_start + offset + 1,
                          'sheet': page_start // pairs_per_sheet + 1,
                          'cell': offset + 1,
                          'kind': item['kind'],
                          'floor': item['after'].get('floor', ''),
                          'routeKeys': sorted(item['keys']),
                          'pointsBefore': item['pointsBefore'],
                          'pointsAfter': item['pointsAfter'],
                          'pointsRemoved': item['pointsRemoved'],
                          'turnsBefore': item['turnsBefore'],
                          'turnsAfter': item['turnsAfter'],
                          'geometryBefore': item['beforeRow'].geometry_sha256,
                          'geometryAfter': item['afterRow'].geometry_sha256,
                      }
                  )
              sheet.save(
                  COMPARISON_DIR / f'comparison-{page_start // pairs_per_sheet + 1:02d}.jpg',
                  quality=48,
                  optimize=True,
                  progressive=True,
              )

          manifest = {
              'schemaVersion': 1,
              'routeRecordCount': route_count,
              'canonicalCandidateGeometryCount': len(overview),
              'changedCanonicalGeometryCount': len(comparisons),
              'overviewSheetCount': math.ceil(len(overview) / sheet_capacity),
              'comparisonSheetCount': math.ceil(detail_limit / pairs_per_sheet),
              'comparisonDetailLimit': detail_limit,
              'overview': overview_manifest,
              'comparisons': comparison_manifest,
          }
          (REPORT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          with (REPORT / 'comparison-index.csv').open('w', encoding='utf-8', newline='') as handle:
              fieldnames = [
                  'index', 'sheet', 'cell', 'kind', 'floor', 'routeKeys',
                  'pointsBefore', 'pointsAfter', 'pointsRemoved',
                  'turnsBefore', 'turnsAfter', 'geometryBefore', 'geometryAfter',
              ]
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              for item in comparison_manifest:
                  writer.writerow({**item, 'routeKeys': '; '.join(item['routeKeys'])})
          print(json.dumps({k: manifest[k] for k in (
              'routeRecordCount', 'canonicalCandidateGeometryCount',
              'changedCanonicalGeometryCount', 'overviewSheetCount',
              'comparisonSheetCount',
          )}, ensure_ascii=False, indent=2))
          PY
      - name: Commit visual evidence
        shell: bash
        run: |
          rm -f .github/route-visual-audit-request
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/route-visual-review/visual-audit .github/route-visual-audit-request
          git commit -m 'Add route visual comparison evidence'
          git push origin HEAD:agent/route-visual-audit
